# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle sync input to all panes (prefix + s)
bind s setw synchronize-panes

# Zen toggle on claude-dash; zoom-toggle fallback elsewhere (prefix + z)
bind z run-shell "if [ \"$(tmux display-message -p '#S')\" = 'claude-dash' ]; then bash ~/.claude/hooks/tmux-zen-toggle.sh; else tmux resize-pane -Z; fi"
