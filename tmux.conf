# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle sync input to all panes (prefix + s)
bind s setw synchronize-panes

# Native pane zoom, all sessions (prefix + z)
bind z resize-pane -Z

# Zen toggle on claude-dash (prefix + f)
bind f run-shell "if [ \"$(tmux display-message -p '#S')\" = 'claude-dash' ]; then bash ~/.claude/hooks/tmux-zen-toggle.sh; fi"
